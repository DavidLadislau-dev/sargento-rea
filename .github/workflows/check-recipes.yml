name: Check recipes

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check recipes
        run: python3 scripts/check_recipes.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
